[project]
name = "digital-twin-api"
version = "0.1.0"
description = "Privacy-first digital twin API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.0,<3",
]

[project.scripts]
digital-twin-worker = "app.worker:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
